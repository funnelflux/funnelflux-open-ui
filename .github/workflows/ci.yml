name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # pnpm version is inferred from package.json#packageManager
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed OpenAPI types
        run: pnpm run check-generated-types:committed

      - name: Lint
        run: pnpm run lint

      - name: Build and verify production artifact
        run: pnpm run build:ci

      - name: Test
        run: pnpm test

      - name: Production dependency audit annotation
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
