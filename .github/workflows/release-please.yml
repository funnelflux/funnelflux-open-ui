name: Release Please

# Runs on every push to the default branch. release-please maintains a rolling
# "release PR" that bumps the version + updates CHANGELOG.md based on the
# Conventional Commits since the last release. Merging that PR creates the
# Git tag (vX.Y.Z) and a GitHub Release.
#
# To force a specific first version, include a footer in any commit:
#   Release-As: 1.0.0
#
# Requires repo setting: Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests" = enabled.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
