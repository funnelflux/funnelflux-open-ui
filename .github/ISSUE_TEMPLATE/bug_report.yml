name: Bug report
description: Report a problem with the FunnelFlux Open UI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I click X, the table fails to load. I expected the rows to render.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / tag or commit
      description: Output of `git describe --tags` or the release tag you are on.
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: FunnelFlux self-hosted version, OS, Node/pnpm version if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console errors / screenshots
      description: Paste any browser console errors or attach screenshots.
      render: shell
    validations:
      required: false
