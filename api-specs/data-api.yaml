            $ref: '#/definitions/Error'
  /data/page/find/byName/index.php:
    get:
      tags: 
        - Pages
      description: Retrieve all pages with the specified name (multiple pages can use the same name)
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: name
          required: true
          in: query
          type: string
      responses:
        200:
          description: List of pages with the specified name
          schema:
            type: array
            items: {
              $ref: '#/definitions/Page'
            }
        403:
          description: Not authorized
        404:
          description: No page with the specified name
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'                        
  /data/page/find/byStatus/index.php:
    get:
      tags: 
        - Pages
      description: Retrieve all pages of the specified type and status
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: pageType
          required: true
          in: query
          type: string
          enum:
            - lander
            - offer
        - name: status
          required: true
          in: query
          type: string
          enum:
            - active
            - archived
            - all
        - name: responseFormat
          required: false
          in: query
          type: string
          enum:
            - standard
            - summary-v1
          description: Omit or use standard for the full Page shape. Use summary-v1 for asset-list rendering; it returns only idPage, pageName, and categoryId unless includeUrl is true.
        - name: includeUrl
          required: false
          in: query
          type: boolean
          description: Only applies when responseFormat=summary-v1. Include the page URL in the slim response when the caller renders or exports URL.
        - name: includePayout
          required: false
          in: query
          type: boolean
          description: Only applies when responseFormat=summary-v1 and pageType=offer. Include payout in the slim response. Ignored for landers.
      responses:
        200:
          description: List of pages of the specified type and status. Returns Page by default, or PageSummary when responseFormat=summary-v1.
          schema:
            type: array
            items: {
              $ref: '#/definitions/Page'
            }
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
