swagger: '2.0'
info:
  title: FunnelFlux Data API
  description: Create, update, retrieve, and delete FunnelFlux assets such as offer sources, traffic sources, pages, campaigns, funnels, conditions, visitor tags, categories, and templates.
  version: "2.0.0"
schemes:
  - http
  - https
host: YOUR_FUNNELFLUX_DOMAIN
basePath: /admin/api/v2
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  ApiKeyQuery:
    type: apiKey
    name: apiKey
    in: query
    description: FunnelFlux API key passed as the `apiKey` query parameter.
security:
  - ApiKeyQuery: []
tags:
  - name: Offer Sources
    description: Offer source management.
  - name: Traffic Sources
    description: Traffic source management.
  - name: Pages
    description: Landers and offers.
  - name: Campaigns
    description: Campaign and funnel group endpoints.
  - name: Funnels
    description: Funnels and funnel configuration.
  - name: Funnel Nodes
    description: Funnel nodes and node configuration.
  - name: Funnel Connections
    description: Connections between funnel nodes.
  - name: Funnel Conditions
    description: Funnel routing conditions.
  - name: Funnel Code Snippets
    description: Custom funnel code snippets.
  - name: Traffic Filters
    description: Traffic filter management.
  - name: Visitor Tags
    description: Visitor tag management.
  - name: Categories
    description: Page and traffic source categories.
  - name: Templates
    description: Template management.
paths:
  /data/offersource/find/byId/index.php:
    get:
      tags: 
        - Offer Sources
      description: Retrieve an offer source by its id
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: idOfferSource
          required: true
          in: query
          type: string
      responses:
        200:
          description: The requested offer source
          schema:
            $ref: '#/definitions/OfferSource'
        403:
          description: Not authorized
        404:
          description: Offer source not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /data/offersource/find/byName/index.php:
    get:
      tags: 
        - Offer Sources
      description: Retrieve an offer source by its name
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: name
          required: true
          in: query
          type: string
      responses:
        200:
          description: The requested offer source
          schema:
            $ref: '#/definitions/OfferSource'
        403:
          description: Not authorized
        404:
          description: Offer source not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /data/offersource/find/byStatus/index.php:
    get:
      tags: 
        - Offer Sources
      description: Retrieve all offer sources with the specified status
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: status
          required: true
          in: query
          type: string
          enum:
            - active
            - archived
            - all
      responses:
        200:
          description: List of offer sources with the specified status
          schema:
            type: array
            items: {
              $ref: '#/definitions/OfferSource'
            }
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'            
  /data/offersource/list/index.php:
    get:
      tags:
        - Offer Sources
      description: Get a lightweight list of offer sources
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: archived
          required: false
          in: query
          type: boolean
          description: Legacy archive filter. If true, return archived offer sources only; if false, return active offer sources only.
        - name: status
          required: false
          in: query
          type: string
          enum:
            - active
            - archived
            - all
          description: Filter offer sources by status. Takes precedence over archived.
      responses:
        200:
          description: List of offer sources
          schema:
            type: array
            items:
              $ref: '#/definitions/IdNamePair'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /data/offersource/save/index.php:
    post:
      tags: 
        - Offer Sources
      description: Create a new offer source
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/OfferSourceSaveRequest'
          description: The offer source definition
      responses:
        200:
          description: Offer source created successfully
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    put:
      tags: 
        - Offer Sources
      description: Update an existing offer source. The id cannot be changed.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/OfferSourceSaveRequest'
          description: The offer source definition
      responses:
        200:
          description: Offer source updated successfully
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /data/offersource/delete/index.php:
    delete:
      tags: 
        - Offer Sources
      description: Delete the specified offer source
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: idOfferSource
          required: true
          in: query
          type: string
      responses:
        200:
          description: Offer source deleted successfully
        403:
          description: Not authorized
        404:
          description: Offer source not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
