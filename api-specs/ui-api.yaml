definitions:
  ResetStatsPageData:
    type: object
    required:
      - availableCampaignsAndFunnels
      - availableTrafficSources
      - availableTimezones
    properties:
      availableCampaignsAndFunnels:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
      availableTrafficSources:
        type: array
        items: {
          $ref: '#/definitions/TrafficSourceInfo'
        }
      availableTimezones:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
  ResetStatsOptions:
    type: object
    required:
      - currentPeriod
    properties:
      currentPeriod:
        $ref: '#/definitions/CurrentPeriod'
      idCampaign:
        type: string
        default: null
        description: Optional campaign scope. Omit or null for all campaigns.
      idFunnel:
        type: string
        default: null
        description: Optional funnel scope. Omit or null for all funnels (within campaign when set).
      idTrafficSource:
        type: string
        default: null
      idVisitor:
        type: string
        default: null
        description: Optional visitor ID to restrict deletion to a single visitor.
  TrafficFilter:
    type: object
    required:
      - idTrafficFilter
      - trafficFilterName
      - filterType
    properties:
      idTrafficFilter:
        type: string
      trafficFilterName:
        description: Traffic filter's name. 255 characters max.
        type: string
        maxLength: 255
      filterType:
        type: string
        enum:
          - ipAddresses
          - ipRanges
          - referrers
          - userAgents
          - ISPs
          - countries
          - knownBotsAndSpiders
      filterEntries:
        description: "The list of entries to filter against. If filterType = ipRanges, then each entry of the list must be formatted as 'rangeStart, rangeEnd', with a comma to separate the range's start and end. If filter type = knownBotsAndSpiders, then this list must be empty."
        type: array
        items: {
          type: string
        }
      redirectToURL:
        description: If set to an actual URL, then the filtered traffic is also redirected to that URL instead of flowing in the funnel
        type: string
        default: null
      isEnabled:
        type: boolean
        default: true
  TrafficFiltersData:
    type: object
    required:
      - filters
      - availableCountries
    properties:
      filters:
        type: array
        items: {
          $ref: '#/definitions/TrafficFilter'
        }
      availableCountries:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      treeGrid:
        description: Legacy grid formatter payload (Body rows are nested arrays). Prefer `filters` for flat lists.
        type: object
        additionalProperties: true
  UpdateCostPageData:
    type: object
    required:
      - availableCampaignsAndFunnels
      - availableTrafficSources
      - availableCountries
      - availableTimezones
    properties:
      availableCampaignsAndFunnels:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
      availableTrafficSources:
        type: array
        items: {
          $ref: '#/definitions/TrafficSourceInfo'
        }
      availableCountries:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      availableTimezones:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
  UpdateCostSegment:
    required:
      - cost
    properties:
      cost:
        type: number
        format: double
        minimum: 0.0
      costType:
        type: string
        enum:
          - costForWholeSegment
          - costPerEntrance
        default: costForWholeSegment
      applyToFilteredTraffic:
        description: If set to true, then the cost update will also take the filtered entrances into account
        type: boolean
        default: false
      restrictToCountryCode:
        description: If set, then update cost of traffic that comes from this country only
        type: string
        default: null
      restrictToTrackingFields:
        description: "If set, then update cost of traffic that have these tracking field values only. The KeyValuePair object is composed of:
            * key - The tracking field name
            * value - The tracking field value"
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
  UpdateCostData:
    required:
      - idFunnel
      - idTrafficSource
      - currentPeriod
      - costSegments
    properties:
      idFunnel:
        type: string
      idTrafficSource:
        type: string
      currentPeriod:
        $ref: '#/definitions/CurrentPeriod'
      costSegments:
        type: array
        items: {
          $ref: '#/definitions/UpdateCostSegment'
        }
  UpdateConversionsEntry:
    type: object
    properties:
      idHit:
        type: string
      transaction:
        type: string
        default: null
      payout:
        type: number
        format: double
        default: null
        description: "If null, then the default offer's payout associated to the hit id is used. If -1, then the conversion associated to this hit id + transaction is deleted."
  UpdateConversionsData:
    type: object
    properties:
      postbackTriggerType:
        type: string
        enum:
          - 'disabled'
          - 'onlyNew'
          - 'all'
        description: Related to traffic source's postback.
      entries:
        type: array
        items: {
          $ref: '#/definitions/UpdateConversionsEntry'
        }
  RedirectMethod:
    type: object
    required:
      - method
    properties:
      method:
        type: string
        enum:
          - 301
          - 307
          - umr
          - fluxify
  SystemSettings:
    type: object
    properties:
      forceHTTPS:
        type: boolean
      defaultHomePageURL:
        type: string
        description: Keep empty for 404
      autoExpandCampaigns:
        type: boolean
      autoDisplayOfferSources:
        type: boolean
      offersDefaultRedirect:
        $ref: '#/definitions/RedirectMethod'
      landersDefaultRedirect:
        $ref: '#/definitions/RedirectMethod'
      minConfidenceRateForWinners:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        default: 95
        description: Show a row in the stats table as winner when confidence rate exceeds this percentage.
      clickbankIPNKey:
        type: string
        minLength: 1
        maxLength: 16
      funnelfluxApiKey:
        type: string
        minLength: 1
  TrafficSourceInfo:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
      defaultCost:
        type: string
        default: '0'
  SystemLinksTrackingURLOptions:
    type: object
    properties:
      idFunnel:
        type: string
        default: null
      idNode:
        type: string
        default: null
      idTrafficSource:
        type: string
        default: null
      defaultCost:
        type: string
        default: null
  SystemLinksOptions:
    type: object
    required:
      - elements
    properties:
      elements:
        type: array
        items: {
          type: string,
          enum: [
            'availableCampaignsFunnelsAndNodes',
            'availableTrafficSources',
            'trackingURL',
            'actionURL',
            'postbackURL',
            'conversionIframe',
            'pixelURLAndHTML',
            'clickbankIPN'
          ]
        }
      trackingURLOptions:
        $ref: '#/definitions/SystemLinksTrackingURLOptions'
        default: null
        description: Required when 'trackingURL' is included in the elements array.
  SystemLinksData:
    type: object
    properties:
      availableCampaignsFunnelsAndNodes:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
      availableTrafficSources:
        type: array
        items: {
          $ref: '#/definitions/TrafficSourceInfo'
        }
        default: []
      trackingURL:
        type: string
        default: null
      actionURL:
        type: string
        default: null
      postbackURL:
        type: string
        default: null
      conversionIframe:
        type: string
        default: null
      pixelURL:
        type: string
        default: null
      pixelHTML:
        type: string
        default: null
      clickbankIPNKey:
        type: string
        default: null
      clickbankIPNURL:
        type: string
        default: null
  StoredLink:
    type: object
    required:
      - id
      - name
      - targetURL
    properties:
      id:
        type: string
      name:
        type: string
        description: Only letters, numbers, minuses and underscores are allowed.
      targetURL:
        type: string
      notes:
        type: string
      tags:
        type: array
        items: {
          type: string
        }
      visits:
        type: integer
        format: int32
        description: Read-only
      trackingURL:
        type: string
        description: Read-only
  StoredLinksOptions:
    type: object
    required:
      - elements
    properties:
      elements:
        type: array
        items: {
          type: string,
          enum: [
            'storedLinks',
            'availableCampaignsFunnelsAndNodes',
            'availableTrafficSources'
          ]
        }
      currentPeriod:
        $ref: '#/definitions/CurrentPeriod'
        default: null
        description: If provided, loads the data for this specific period and save it as the current one. If not provided, use the currently saved period.
  StoredLinksData:
    type: object
    properties:
      currentPeriod:
        $ref: '#/definitions/CurrentPeriod'
      storedLinks:
        type: array
        items: {
          $ref: '#/definitions/StoredLink'
        }
        default: []
      availableCampaignsFunnelsAndNodes:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
      availableTrafficSources:
        type: array
        items: {
          $ref: '#/definitions/TrafficSourceInfo'
        }
        default: []
  PermissionsStats:
    type: object
    properties:
      enabled: 
        type: boolean
        default: false
      canView:
        type: boolean
        default: false
      canEditCustomViews:
        type: boolean
        default: false
