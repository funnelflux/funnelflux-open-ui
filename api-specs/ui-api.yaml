  DateTimeRange:
    type: object
    required:
      - start
      - end
    description: "'start' is included while 'end' is excluded. Typically, the test is start &lt;= time &lt; end"
    properties:
      start:
        $ref: '#/definitions/DateTime'
      end:
        $ref: '#/definitions/DateTime'
  DateTime:
    type: object
    required:
      - date
      - time
    properties:
      date:
        $ref: '#/definitions/Date'
      time:
        $ref: '#/definitions/TimeHHMM'
  Date:
    type: object
    required:
      - year
      - month
      - day
    properties:
      year:
        type: integer
        format: int32
        minimum: 1970
      month:
        type: integer
        format: int32
        minimum: 1
        maximum: 12
      day:
        type: integer
        format: int32
        minimum: 1
        maximum: 31
  TimeHHMM:
    type: object
    required:
      - hour
      - minutes
    properties:
      hour:
        type: integer
        format: int32
        minimum: 0
        maximum: 23
      minutes:
        type: integer
        format: int32
        minimum: 0
        maximum: 59
  IntegerValue:
    type: object
    properties:
      value:
        type: integer
        format: int32
  MiscElements:
    type: object
    required:
      - elements
    properties:
      elements:
        type: array
        items: {
          type: string,
          enum: [ 
            'pageCategories',
            'campaignsAndFunnels',
            'trafficSources',
            'trafficSourcesAndTrackingFields',
            'offerSources',
            'urlTokens'
          ]
        }
  MiscData:
    type: object
    properties:
      pageCategories:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
        default: null
      campaignsAndFunnels:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: null
      trafficSources:
        type: array
        items: {
          $ref: '#/definitions/TrafficSourceInfo'
        }
        default: null
      trafficSourcesAndTrackingFields:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: null
      offerSources:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
        default: null
      urlTokens:
        type: array
        items: {
          type: string
        }
        default: null
  KeyValuePair:
    type: object
    required:
      - key
    properties:
      key: 
        type: string
      value:
        type: string
  KeyValuePairTreeItem:
    type: object
    required:
      - item
    properties:
      item: 
        $ref: '#/definitions/KeyValuePair'
      children:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
  BulkIDs:
    type: object
    required:
      - ids
    properties:
      ids:
        type: array
        items: {
          type: string
        }
  SessionInfo:
    type: object
    properties:
      authenticated:
        type: boolean
      userId:
        type: string
      username:
        type: string
      isAdmin:
        type: boolean
  NotificationCheck:
    type: object
    properties:
      unreadCount:
        type: integer
      forcePopup:
        type: boolean
      forcePopupMessage:
        type: string
      notification:
        type: object
  AccessRight:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      granted:
        type: boolean
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
