swagger: '2.0'
info:
  title: FunnelFlux UI API
  description: Endpoints used by the FunnelFlux admin interface. Browser callers can authenticate with an existing PHP admin session; API key authentication remains available for legacy and automation callers.
  version: "2.0.0"
schemes:
  - http
  - https
host: YOUR_FUNNELFLUX_DOMAIN
basePath: /admin/api/v2
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  ApiKeyQuery:
    type: apiKey
    name: apiKey
    in: query
    description: FunnelFlux API key passed as the `apiKey` query parameter.
security:
  - ApiKeyQuery: []
tags:
  - name: Dashboard
    description: Dashboard summary data.
  - name: Campaigns
    description: Campaign and funnel group endpoints.
  - name: Traffic Sources
    description: Traffic source management.
  - name: Offer Sources
    description: Offer source management.
  - name: Offers
    description: Offer management.
  - name: Landers
    description: Landing page management.
  - name: Quick Stats
    description: Quick stats for campaigns and funnels.
  - name: Drilldowns
    description: Drilldown reporting data used by the admin interface.
  - name: System Updates
    description: System update views and actions.
  - name: Access Log
    description: Access log views and supporting data.
  - name: Inbox
    description: Admin inbox data.
  - name: User Profile
    description: Logged-in user profile data.
  - name: User Management
    description: User management views and actions.
  - name: Stored Links
    description: Stored tracking links.
  - name: System Links
    description: System link helpers.
  - name: System Settings
    description: System settings used by the admin interface.
  - name: Update Conversions
    description: Conversion upload and update workflows.
  - name: Update Cost
    description: Cost upload and update workflows.
  - name: Traffic Filters
    description: Traffic filter management.
  - name: Reset Stats
    description: Stats reset workflows.
  - name: Session
    description: Logged-in user session helpers.
  - name: Authentication
    description: Authentication and admin session endpoints.
  - name: Miscellaneous
    description: Shared utility endpoints used by the admin interface.
paths:
  /ui/misc/load/index.php:
    post:
      tags:
        - Miscellaneous
      description: Get misc data that don't fit anywhere else for now (temporary)
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/MiscElements'
      responses:
        200:
          description: Data loaded successfully.
          schema:
            $ref: '#/definitions/MiscData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/session/tracking/delete/index.php:
    delete:
      tags:
        - Session
      description: Clear the user's tracking session
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Tracking session cleared
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/resetstats/load/index.php:
    get:
      tags:
        - Reset Stats
      description: Get the data needed by the reset stats page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully.
          schema:
            $ref: '#/definitions/ResetStatsPageData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/resetstats/calculate/index.php:
    post:
      tags:
        - Reset Stats
      description: Calculate how many hits would be deleted based on the provided options.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/ResetStatsOptions'
      responses:
        200:
          description: Returns the number of hits that would be deleted with the provided options
          schema:
            $ref: '#/definitions/IntegerValue'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/resetstats/delete/index.php:
    delete:
      tags:
        - Reset Stats
      description: Delete hits based on the provided options.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/ResetStatsOptions'
      responses:
        200:
          description: Hits will be deleted - this will be processed in a background job.
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/trafficfilters/load/index.php:
    get:
      tags:
        - Traffic Filters
      description: Get the data needed by the traffic filters page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully.
          schema:
            $ref: '#/definitions/TrafficFiltersData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/trafficfilters/save/index.php:
    put:
      tags:
        - Traffic Filters
      description: Update an existing traffic filter or create a new one.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/TrafficFilter'
      responses:
        200:
          description: Traffic filter saved successfully.
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/trafficfilters/delete/index.php:
    delete:
      tags:
        - Traffic Filters
      description: Delete a traffic filter from database.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: id
          required: true
          in: query
          type: string
          description: Id of the TrafficFilter to delete
      responses:
        200:
          description: Data deleted successfully. 
        403:
          description: Not authorized
        404:
          description: TrafficFilter not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/updatecost/load/index.php:
    get:
      tags:
        - Update Cost
      description: Get the data needed by the cost update page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully.
          schema:
            $ref: '#/definitions/UpdateCostPageData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/updatecost/upload/index.php:
    put:
      tags:
        - Update Cost
      description: Upload new traffic cost
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/UpdateCostData'
      responses:
        200:
          description: Cost uploaded successfully. This will be processed in a background job.
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/updateconversions/upload/index.php:
    put:
      tags:
        - Update Conversions
      description: Upload new conversion entries
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/UpdateConversionsData'
      responses:
        200:
          description: Conversions uploaded successfully. They will be processed in a background job.
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/systemsettings/load/index.php:
    get:
      tags:
        - System Settings
      description: Loads the data needed by the system settings page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/SystemSettings'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'        
  /ui/systemsettings/save/index.php:
    put:
      tags:
        - System Settings
      description: Saves the system settings
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/SystemSettings'
      responses:
        200:
          description: System settings saved successfully. 
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/systemlinks/load/index.php:
    post:
      tags:
        - System Links
      description: Loads the data needed by the system links page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/SystemLinksOptions'
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/SystemLinksData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'        
  /ui/storedlinks/load/index.php:
    post:
      tags:
        - Stored Links
      description: Loads the data needed by the stored links page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/StoredLinksOptions'
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/StoredLinksData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/storedlinks/save/index.php:
    put:
      tags:
        - Stored Links
      description: Save a stored link. If a stored link with the same id already exists, it gets updated. Otherwise a new one is created.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/StoredLink'
      responses:
        200:
          description: Data saved successfully. 
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/storedlinks/reset/index.php:
    put:
      tags:
        - Stored Links
      description: Reset the number of visits of a stored link.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: id
          required: true
          in: query
          type: string
          description: Id of the StoredLink to reset
      responses:
        200:
          description: Data reset successfully. 
        403:
          description: Not authorized
        404:
          description: StoredLink not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/storedlinks/delete/index.php:
    delete:
      tags:
        - Stored Links
      description: Delete a stored link from database.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: id
          required: true
          in: query
          type: string
          description: Id of the StoredLink to delete
      responses:
        200:
          description: Data deleted successfully. 
        403:
          description: Not authorized
        404:
          description: StoredLink not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'    
  /ui/usermanagement/load/index.php:
    get:
      tags:
        - User Management
      description: Loads the data needed by the user management page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/UserManagementData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/usermanagement/changeUsersStatus/index.php:
    put:
      tags:
        - Inbox
      description: Changes the 'enabled' status of the specified users
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: enabled
          required: true
          in: query
          type: boolean
          description: The new 'enabled' status for the specified users
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/BulkIDs'
      responses:
        200:
          description: Enabled status changed successfully. 
        403:
          description: Not authorized
        404:
          description: At least one user was not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/usermanagement/delete/index.php:
    delete:
      tags:
        - Inbox
      description: Delete the specified users from the database.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/BulkIDs'
      responses:
        200:
          description: Users deleted successfully. 
        403:
          description: Not authorized
        404:
          description: At least one user was not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/userprofile/load/index.php:
    get:
      tags:
        - User Profile
      description: Loads the data needed by the user profile page. Supports either a valid PHP admin session or an apiKey query parameter.
      parameters:
        - name: apiKey
          required: false
          in: query
          type: string
          description: Optional for browser requests with a valid PHP admin session. Required for legacy and automation callers.
        - name: id
          required: true
          in: query
          type: string
          description: The user ID
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/UserProfile'
        403:
          description: Not authorized
        404:
          description: User not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/userprofile/loggedin/load/index.php:
    get:
      tags:
        - User Profile
      description: Loads the UserProfile of the logged in user. Supports either a valid PHP admin session or an apiKey query parameter.
      parameters:
        - name: apiKey
          required: false
          in: query
          type: string
          description: Optional for browser requests with a valid PHP admin session. Required for legacy and automation callers.
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/UserProfile'
        403:
          description: Not authorized
        404:
          description: User not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/userprofile/save/index.php:
    put:
      tags:
        - User Profile
      description: Saves the provided user profile. If a user with the provided id already exists, its settings will be updated. If there is no user with the provided id, then a new one will be created. A password is required whenever this endpoint creates a new user; existing user password changes must use /ui/userprofile/changePassword/index.php. Note that the avatarURL is not saved. You must use the avatar/upload/ endpoint for this. Supports either a valid PHP admin session or an apiKey query parameter.
      parameters:
        - name: apiKey
          required: false
          in: query
          type: string
          description: Optional for browser requests with a valid PHP admin session. Required for legacy and automation callers.
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/UserProfileUpdate'
      responses:
        200:
          description: User profile saved successfully. 
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/userprofile/changePassword/index.php:
    post:
      tags:
        - User Profile
      description: Authenticated users can only change their own password. The old password is verified, the new password is saved with password_hash(), and the session password hash is refreshed so the user stays logged in. Backend validation errors are returned.
      parameters:
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/UserPasswordChangeRequest'
      responses:
        200:
          description: Password changed successfully.
        401:
          description: No valid session
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    put:
      tags:
        - User Profile
      description: Admin or automation password set operation. Supports either an admin PHP session or an apiKey query parameter. Session users must be admins to change another user's password; non-admin session users can only change their own password and must provide oldPassword.
      parameters:
        - name: apiKey
          required: false
          in: query
          type: string
          description: Optional for browser requests with a valid PHP admin session. Required for legacy and automation callers.
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/AdminUserPasswordSetRequest'
      responses:
        200:
          description: Password changed successfully.
        403:
          description: Not authorized
        404:
          description: User not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/inbox/load/index.php:
    get:
      tags:
        - Inbox
      description: Loads the data needed by the inbox page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/InboxData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/inbox/message/load/index.php:
    get:
      tags:
        - Inbox
      description: Loads a specific message from the inbox
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: id
          required: true
          in: query
          type: string
          description: The ID of the message to load
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/InboxMessage'
        403:
          description: Not authorized
        404:
          description: Message not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/inbox/message/changeReadStatus/index.php:
    put:
      tags:
        - Inbox
      description: Changes the read status of the specified messages
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: alreadyRead
          required: true
          in: query
          type: boolean
          description: The new 'read status' of the specified messages
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/BulkIDs'
      responses:
        200:
          description: Read status changed successfully. 
        403:
          description: Not authorized
        404:
          description: At least one message was not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/inbox/message/delete/index.php:
    delete:
      tags:
        - Inbox
      description: Delete the specified messages from the database.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/BulkIDs'
      responses:
        200:
          description: Messages deleted successfully. 
        403:
          description: Not authorized
        404:
          description: At least one message was not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/inbox/notifications/load/index.php:
    get:
      tags:
        - Inbox
      description: Get information about current notifications
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Notifications information
          schema:
            $ref: '#/definitions/InboxNotifications'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/accesslog/load/index.php:
    get:
      tags:
        - Access Log
      description: Loads the data needed by the access log page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/AccessLogData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/systemupdates/load/index.php:
    get:
      tags:
        - System Updates
      description: Loads the data needed by the system updates page
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: loadRows
          required: true
          in: query
          type: string
          description: If true, load SystemUpdatesData.rows
        - name: loadCurrentlyInstalling
          required: true
          in: query
          type: string
          description: If true, load SystemUpdatesData.currentlyInstalling
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/SystemUpdatesData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/systemupdates/install/index.php:
    post:
      tags:
        - System Updates
      description: Launch a system update
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: id
          required: true
          in: query
          type: string
          description: Id of the system update to install
      responses:
        200:
          description: Update launched
          schema:
            $ref: '#/definitions/SystemUpdateCurrentlyInstalling'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/drilldowns/load/index.php:
    post:
      tags:
        - Drilldowns
      description: Loads the data needed by the drilldowns page. 
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/DrilldownOptions'
      responses:
        200:
          description: Data loaded successfully. 
          schema:
            $ref: '#/definitions/DrilldownData'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /ui/drilldowns/view/save/index.php:
    post:
      tags:
        - Drilldowns
      description: Saves the specified view. If a view with this id already exists, then it is replaced. Otherwise a new one is created.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: '#/definitions/DrilldownViewSaveRequest'
      responses:
        200:
          description: View saved successfully.
          schema:
            $ref: '#/definitions/DrilldownViewSaveResponse'
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
    put:
      tags:
        - Drilldowns
      description: Saves the specified view. If a view with this id already exists, then it is replaced. Otherwise a new one is created.
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
