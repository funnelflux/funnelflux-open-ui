  DrilldownAvailableGrouping:
    type: object
    required:
      - groupBy
    properties:
      groupBy: 
        type: string
      availableFilters:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
        description: Filters that can be used with this groupBy.
      filtersDependOnOtherGroupBy:
        type: string
        default: 'none'
        description: "If 'none', then these filters do not depend on another selected groupBy. Otherwise, these filters depend on which other filter is used for that other groupBy. Example: If this equals 'none', then the availableFilters will have only 1 entry with key 'none' - and the children of that element will be all the available filters. But if this property equals 'Element: Campaign' for example, then the availableFilters will be an array where each entry's key is the id of a different campaign and the entry's children are the filters available for that specific campaign. Note that even in that case, the array of availableFilters still have its first entry with key 'none' where all filters are available at once."
