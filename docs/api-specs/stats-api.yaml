  Grouping:
    type: object
    required:
      - groupBy
    properties:
      groupBy:
        type: string
        description: >
          Canonical grouping names as listed below. The server also accepts wire-only aliases
          `__TRACKING_FIELD_1__` … `__TRACKING_FIELD_10__` (normalized to `URL Tracking Field`);
          pair those with `trackingFieldMappings` on the drilldown request.
