swagger: "2.0"
info:
  title: FunnelFlux Stats API
  description: API endpoints to manage stats and run statistic reports
  version: "2.0.0"
schemes:
  - http
  - https
host: ff-domain.com
basePath: /admin/api/v2
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: reporting
    description: API endpoints to get stat reports
  - name: update
    description: API endpoints to update stats
paths:
  /stats/reporting/groupings/index.php:
    get:
      tags:
        - reporting
      description: Returns the list of available groupings
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
      responses:
        200:
          description: The groupings list as a string array
          schema:
            type: array
            items: { type: string }
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
  /stats/reporting/drilldown/index.php:
    post:
      tags:
        - reporting
      description: Create and run a new drilldown report
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: "#/definitions/DrilldownRequest"
      responses:
        200:
          description: The requested report
          schema:
            $ref: "#/definitions/Report"
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
  /stats/update/conversions/index.php:
    put:
      tags:
        - update
      description: Add new or update existing conversions
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: "#/definitions/ConversionsUpload"
      responses:
        200:
          description: Background job created successfully
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
  /stats/update/reset/index.php:
    delete:
      tags:
        - update
      description: Reset specific hits
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: "#/definitions/ResetHits"
      responses:
        200:
          description: Background job created successfully
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
    get:
      tags:
        - update
      description: Get the number of visits that would be deleted with the specified settings
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: "#/definitions/ResetHits"
      responses:
        200:
          description: The number of would-be impacted visits
          schema:
            $ref: "#/definitions/IntegerValue"
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
  /stats/update/cost/index.php:
    put:
      tags:
        - update
      description: Update the cost of a traffic segment
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: body
          required: true
          in: body
          schema:
            $ref: "#/definitions/CostUpload"
      responses:
        200:
          description: Background job created successfully
        403:
          description: Not authorized
        default:
          description: Unexpected error
          schema:
            $ref: "#/definitions/Error"
definitions:
  CostSegment:
    required:
      - cost
    properties:
      cost:
        type: number
        format: double
        minimum: 0.0
      costType:
        type: string
        enum:
          - costForWholeSegment
          - costPerEntrance
        default: costForWholeSegment
      applyToFilteredTraffic:
        description: If set to true, then the cost update will also take the filtered entrances into account
        type: boolean
        default: false
      restrictToCountryCode:
        description: If set, then update cost of traffic that comes from this country only
        type: string
        default: null
      restrictToTrackingFields:
        description:
          "If set, then update cost of traffic that have these tracking field values only. The KeyValuePair object is composed of:
          * key - The tracking field name
          * value - The tracking field value"
        type: array
        items: { $ref: "#/definitions/KeyValuePair" }
  CostUpload:
    required:
      - idTrafficSource
      - timeRange
      - timeZone
      - costSegments
    properties:
      idFunnel:
        description: "Optional funnel ID to narrow scope. If omitted, cost update applies to all funnels for the traffic source."
        type: integer
        format: int64
      idTrafficSource:
        description: 64 bits integer id of the traffic source
        type: integer
        format: int64
        minimum: 1
      timeRange:
        $ref: "#/definitions/DateTimeRange"
      timeZone:
        $ref: "#/definitions/TimeZone"
      costSegments:
        type: array
        items: { $ref: "#/definitions/CostSegment" }
      notificationWhenComplete:
        type: boolean
        default: false
  ResetHits:
    required:
      - timeRange
      - timeZone
    properties:
      timeRange:
        $ref: "#/definitions/DateTimeRange"
      timeZone:
        $ref: "#/definitions/TimeZone"
      restrictToFunnelId:
        type: string
        default: null
      restrictToTrafficSourceId:
        type: string
        default: null
      restrictToVisitorId:
        type: string
        default: null
  ConvertedHit:
    required:
      - idHit
    properties:
      idHit:
        description: 64 bits integer corresponding to the hit id
        type: integer
        format: int64
        minimum: 1
      transaction:
        description: The optional transaction id
        type: string
        default: ""
      payout:
        description: An optional payout amount. When not specified, the default payout from the converted offer is used. If set to -1, then this hit is set as non-converted.
        type: number
        format: double
        default: null
  ConversionsUpload:
    required:
      - hits
    properties:
      hits:
        type: array
        items: { $ref: "#/definitions/ConvertedHit" }
      postbackCalls:
        description: "Call the traffic source postbacks of the sources that generated theses conversions. If set to 'none', then the postbacks are not called for any of the specified hits. If set to 'onlyOnce', then the postbacks are only called for the hits that never called them before. If set to 'all', the postbacks are called for all the specified hits, even if they were already called in the past for some/all hits."
        type: string
        enum:
          - none
          - onlyOnce
          - all
        default: none
      notificationWhenComplete:
        type: boolean
        default: false
  TimeZone:
    description: "When a TimeZone object is provided as an input to an API function, then either offset or name is required. If both are given, then 'name' takes precedence. When a TimeZone object is sent back from an API function, both 'offset' and 'name' are filled."
