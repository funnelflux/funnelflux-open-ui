        description: >
          If not empty, then only rows where at least one of the specified filters is true will be returned.
          For asset-related groupings like 'traffic source', 'campaign', 'lander' etc, a filter must be the asset's id.
          For `URL Tracking Field` / `__TRACKING_FIELD_N__`, a filter is typically the URL parameter name
          (e.g. `adgroup`) matching `trackingFieldMappings`, or `field$@$value` to restrict to a specific token/value
          (server uses the `$@$` concatenator). Otherwise, for groupings like 'country', 'device type' etc, a filter is
          a case-insensitive string. Filters can contain wildcards *.
        type: array
        items: { type: string }
      blacklistFilters:
        description: "If not empty, then only rows where all the specified filters are false will be returned. For asset-related groupings like 'traffic source', 'campaign', 'lander' etc, a filter must be the asset's id. Otherwise, for groupings like 'country', 'device type' etc, a filter is a case-insensitive string representing the data, like 'Malaysia', 'Smartphone' etc... Filters can contain wildcards *"
        type: array
        items: { type: string }
  MetricNames:
    type: object
    properties:
      names:
        type: string
        enum:
          - "Entrances"
          - "Node Views"
          - "Lander Views"
          - "Lander Clicks"
          - "Offer Views"
          - "Offer Clicks"
          - "Conv."
          - "Indirect Conv."
          - "Revenue"
          - "Indirect Revenue"
          - "Cost"
          - "P/L"
          - "ROI"
          - "Lander CTR"
          - "Offer CTR"
          - "EPa"
          - "CPa"
          - "CVRe"
          - "EPe"
          - "CPe"
          - "CVRov"
          - "EPov"
          - "CPov"
          - "CVRlv"
          - "EPlv"
          - "CPlv"
          - "CVRnv"
          - "EPnv"
          - "CPnv"
          - "Unique Entrances"
          - "Unique Node Views"
          - "Unique Lander Views"
          - "Unique Lander Clicks"
          - "Unique Offer Views"
          - "Unique Offer Clicks"
          - "Unique Lander CTR"
          - "Unique Offer CTR"
          - "Unique CVRe"
          - "Unique EPe"
          - "Unique CPe"
          - "Unique CVRov"
          - "Unique EPov"
          - "Unique CPov"
          - "Unique CVRlv"
          - "Unique EPlv"
          - "Unique CPlv"
          - "Unique CVRnv"
          - "Unique EPnv"
          - "Unique CPnv"
  RequestPaging:
    type: object
    properties:
      start:
        type: integer
        format: int32
        default: 0
        minimum: 0
      length:
        type: integer
        format: int32
        default: 50
        minimum: 1
  FilterColumn:
    type: object
    required:
      - columnName
      - filter
    properties:
      columnName:
        description: "Name of the column to filter. It can be a grouping name as defined in the 'Grouping' object, or a metric name as defined in the 'MetricNames' oject"
        type: string
      filter:
        description: "Grouping filters can contain wildcards '*'. Metric filters can contain '<', '<=', '>', '>='"
        type: string
  RequestColumnFilters:
    type: object
    properties:
      filterColumns:
        type: array
        default: []
        items: { $ref: "#/definitions/FilterColumn" }
  SortingColumn:
    type: object
    properties:
      columnName:
        description: "Column name to sort by. It can be a grouping name as defined in the 'Grouping' object, or a metric name as defined in the 'MetricNames' oject"
        type: string
        default: "Entrances"
      order:
        type: string
        default: desc
        enum:
          - desc
          - asc
  RequestSorting:
    type: object
    properties:
      sortingColumns:
        type: array
        default: []
        items: { $ref: "#/definitions/SortingColumn" }
  RequestOptions:
    type: object
    properties:
      viewType:
        description: "'flat' returns flattened rows. 'tree' returns full tree rows. 'mixed' returns flattened rows except for groupings like 'conversion paths' that are best represented as a tree."
        type: string
        enum:
          - flat
          - tree
          - mixed
        default: "tree"
      showArchivedAssets:
        type: boolean
        default: true
      showFilteredTraffic:
        type: boolean
        default: false
      onlyConvertedHits:
        type: boolean
        default: false
      computeCTRConfidenceRate:
        type: boolean
        default: false
      computeCVRConfidenceRate:
        type: boolean
        default: false
      computeEPVConfidenceRate:
        type: boolean
        default: false
      confidenceRateIncludeAll:
        description: If true, then the calculated confidence rates also take rows with 0 successes into account.
        type: boolean
        default: false
      idCampaignFilter:
        type: string
        default: null
        description: If set, stats are restricted to the specified campaign
      idFunnelFilter:
        type: string
        default: null
        description: If set, stats are restricted to the specified funnel
      idTrafficSourceFilter:
        type: string
        default: null
        description: If set, stats are restricted to the specified traffic source
  DrilldownRequest:
    type: object
    required:
      - timeRange
      - timeZone
    properties:
      timeRange:
        $ref: "#/definitions/DateTimeRange"
      timeZone:
        $ref: "#/definitions/TimeZone"
      groupings:
        type: array
        items: { $ref: "#/definitions/Grouping" }
      topLevelFilters:
        type: array
        items: { $ref: "#/definitions/Grouping" }
      columnFilters:
        $ref: "#/definitions/RequestColumnFilters"
      paging:
        $ref: "#/definitions/RequestPaging"
      sorting:
        $ref: "#/definitions/RequestSorting"
      options:
        $ref: "#/definitions/RequestOptions"
      trackingFieldMappings:
        description: >
          Maps each `__TRACKING_FIELD_N__` slot to the traffic-source URL parameter name (`id`) used for that
          grouping level. Sent with JSON body to `POST /stats/reporting/drilldown/`. The PHP handler normalizes
          `groupBy` to `URL Tracking Field` and uses this object to resolve which parameter each level targets.
        type: object
        additionalProperties:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              description: URL tracking parameter key (e.g. adgroup, querystring, c1)
  ConfidenceRate:
    type: object
    properties:
      rate:
        description: Confidence rate of being the winner. -1 means not calculated
        type: number
        format: double
        minimum: 0.0
        maximum: 1.0
  ReportColumn:
    type: object
    required:
      - name
      - type
    properties:
      name:
        description: Column name
        type: string
      type:
        description: "If type is 'metric', then the column name MUST be one of the names defined in 'MetricNames'. If type is 'grouping', then the column name MUST be one of the names defined in the 'Grouping' object"
        type: string
        enum:
          - grouping
          - metric
      description:
        description: Column description
        default: ""
        type: string
  ReportCell:
    type: object
    required:
      - formatted
      - raw
    properties:
      formatted:
        description: "Cell's value formatted like 'Google Adwords', '0.23%' or 'N/A'."
        type: string
      raw:
        description: "Non formatted cell's value like 0.213245454 for the ctr etc ... null means 'N/A'. If the cell is from a grouping column, then this value represents its id."
        type: string
  ReportRow:
    type: object
    required:
      - cells
      - rowId
    properties:
      cells:
        type: array
        items: { $ref: "#/definitions/ReportCell" }
      rowId:
        type: string
        description: Unique id of this row
      ctrLanderConfidenceRate:
        $ref: "#/definitions/ConfidenceRate"
      ctrOfferConfidenceRate:
        $ref: "#/definitions/ConfidenceRate"
      cvrConfidenceRate:
        $ref: "#/definitions/ConfidenceRate"
      epvConfidenceRate:
        $ref: "#/definitions/ConfidenceRate"
      children:
        type: array
        items: { $ref: "#/definitions/ReportRow" }
      parentRowId:
        type: string
        description: "Id of the parent row or null if none. Note that a row cannot have children or a parent when 'RequestOptions.viewType' is 'flat'."
  Report:
    type: object
    required:
      - columns
      - rows
      - totals
      - rowsReturned
      - rowsTotal
    properties:
      columns:
        type: array
        items: { $ref: "#/definitions/ReportColumn" }
      rows:
        type: array
        items: { $ref: "#/definitions/ReportRow" }
      totals:
        $ref: "#/definitions/ReportRow"
      rowsReturned:
        description: The number of returned rows
        type: integer
        format: int32
        minimum: 0
      rowsTotal:
        description: The total number of available rows when RequestPaging is not restricting what is returned
        type: integer
        format: int32
        minimum: 0
  DateTimeRange:
    type: object
    required:
      - start
      - end
    description: "'start' is included while 'end' is excluded. Typically, the test is start <= time < end"
    properties:
      start:
        $ref: "#/definitions/DateTime"
      end:
        $ref: "#/definitions/DateTime"
  DateTime:
    type: object
    required:
      - date
      - time
    properties:
      date:
        $ref: "#/definitions/Date"
      time:
        $ref: "#/definitions/TimeHHMM"
  Date:
    type: object
    required:
      - year
      - month
      - day
    properties:
      year:
        type: integer
        format: int32
        minimum: 1970
      month:
        type: integer
        format: int32
        minimum: 1
        maximum: 12
      day:
        type: integer
        format: int32
        minimum: 1
        maximum: 31
  TimeHHMM:
    type: object
    required:
      - hour
      - minutes
    properties:
      hour:
        type: integer
        format: int32
        minimum: 0
        maximum: 23
      minutes:
        type: integer
        format: int32
        minimum: 0
        maximum: 59
  IntegerValue:
    type: object
    properties:
      value:
        type: integer
        format: int32
  KeyValuePair:
    type: object
    required:
      - key
    properties:
      key:
        type: string
      value:
        type: string
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
