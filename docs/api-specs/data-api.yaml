definitions:
  TrafficFilter:
    type: object
    required:
      - idTrafficFilter
      - trafficFilterName
      - filterType
    properties:
      idTrafficFilter:
        description: 64 bits integer id of the traffic filter
        type: integer
        format: int64
        minimum: 1
      trafficFilterName:
        description: Traffic filter's name. 255 characters max.
        type: string
        maxLength: 255
      filterType:
        type: string
        enum:
          - ipAddresses
          - ipRanges
          - referrers
          - userAgents
          - ISPs
          - countries
          - knownBotsAndSpiders
      filterEntries:
        description: "The list of entries to filter against. If filterType = ipRanges, then each entry of the list must be formatted as 'rangeStart, rangeEnd', with a comma to separate the range's start and end. If filter type = knownBotsAndSpiders, then this list must be empty."
        type: array
        items: {
          type: string
        }
      redirectToURL:
        description: If set to an actual URL, then the filtered traffic is also redirected to that URL instead of flowing in the funnel
        type: string
        default: null
      isEnabled:
        type: boolean
        default: true
  OfferSource:
    type: object
    required:
      - idOfferSource
      - offerSourceName
    properties:
      idOfferSource:
        description: 64 bits integer id of the offer source
        type: integer
        format: int64
        minimum: 1
      offerSourceName:
        description: Offer source's name. 255 characters max.
        type: string
      subId:
        description: "Name of the parameter to pass unique hit ids to your offer source"
        type: string
        default: ''
      querySeparator:
        description: "Which character is used to separate an offer's base url from its query parameters"
        type: string
        default: '?'
      postbackSubId:
        description: "Name of the subid parameter your offer source sends back to FunnelFlux when a conversion occurs"
        type: string
        default: ''
      postbackTxId:
        description: "Name of the unique transaction id parameter your offer source sends back to FunnelFlux when a conversion occurs"
        type: string
        default: ''
      postbackPayout:
        description: "Name of the payout parameter your offer source sends back to FunnelFlux when a conversion occurs"
        type: string
        default: ''
      isArchived:
        type: boolean
        default: false
  TrafficSource:
    type: object
    required:
      - idTrafficSouce
      - trafficSourceName
      - costType
    properties:
      idTrafficSouce:
        description: 64 bits integer id of the traffic source
        type: integer
        format: int64
        minimum: 1
      trafficSourceName:
        description: Traffic source's name. 255 characters max.
        type: string
      costType:
        type: string
        enum:
          - cpe
          - cpa
        default: cpe
      defaultCost:
        type: string
        default: '0'
      trackingFields:
        description: The tracking field names and their associated default tokens
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      postback:
        $ref: '#/definitions/Postback'
      categoryName:
        description: Read-only category name.
        type: string
      isArchived:
        type: boolean
        default: false
  KeyValuePair:
    type: object
    required:
      - key
    properties:
      key: 
        type: string
      value:
        type: string
  KeyValuePairTreeItem:
    type: object
    required:
      - item
    properties:
      item: 
        $ref: '#/definitions/KeyValuePair'
      children:
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
  Postback:
    type: object
    required:
      - idTrafficSource
      - postbackType
      - postbackCode
    properties:
      idTrafficSource:
        type: string
      postbackType:
        type: string
        enum:
          - none
          - postbackUrl
          - pixelUrl
          - javascript
        default: none
      postbackCode:
        type: string
        default: ''
  FunnelNodeRotatorParams:
    type: object
    properties:
      rotatorType:
        description: How the rotator will operate. If 'session', then one visitor will always follow the same route.
        type: string
        enum:
          - random
          - session
        default: random
  FunnelNodePageParams:
    type: object
    required:
      - idPage
    properties:
      idPage:
        description: 64 bits integer id of the lander or offer page
        type: integer
        format: int64
        minimum: 1
      accumulateUrlParams:
        description: If true, then the accumulated URL params are forwarded to this node's url
        type: boolean
        default: false
      additionalTokens:
        description: Tokens to compute and then forward to this node's url
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
  FunnelNodeExternalUrlParams:
    type: object
    required:
      - url
    properties:
      url:
        description: URL to redirect to
        type: string
  FunnelNodeCodeSnippetParams:
    type: object
    required:
      - idCode
    properties:
      idCode:
        description: 64 bits integer id of the code snippet
        type: integer
        format: int64
        minimum: 1
  FunnelNodeConditionParams:
    type: object
    required: 
      - idCondition
    properties:
      idCondition:
        description: 64 bits integer id of the condition
        type: integer
        format: int64
        minimum: 1
  FunnelNodeVisitorTagParams:
    type: object
    required: 
      - tags
    properties:
      tags:
        type: array
        items: {
          type: string
        }
  FunnelNode:
    type: object
    required:
      - idNode
      - idFunnel
      - nodeName
      - nodeType
    properties:
      idNode: 
        description: 64 bits integer unique id of the node
        type: integer
        format: int64
        minimum: 1
      idFunnel:
        description: 64 bits integer id of the parent funnel
        type: integer
        format: int64
        minimum: 1
      nodeName:
        type: string
      nodeType:
        description: The type of this node. Depending on the value, different parameters may be required. >
          <ul>
            <li>If nodeType is 'root' or 'rotator' then the property 'nodeRotatorParams' is optional</li>
            <li>If nodeType is 'lander' or 'offer' then the property 'nodePageParams' is required</li>
            <li>If nodeType is 'externalUrl' then the property 'nodeExternalUrlParams' is required</li>
            <li>If nodeType is 'jsCode' or 'phpCode' then the property 'nodeCodeParams' is required</li>
            <li>If nodeType is 'condition' then the property 'nodeConditionParams' is required</li>
            <li>If nodeType is 'visitorTag' then the property 'nodeVisitorTagParams' is required</li>
          </ul>
        type: string
        enum:
          - root
          - rotator
          - lander
          - offer
          - externalUrl
          - jsCode
          - phpCode
          - condition
          - visitorTag
      nodeRotatorParams:
        $ref: '#/definitions/FunnelNodeRotatorParams'
      nodePageParams:
        $ref: '#/definitions/FunnelNodePageParams'
      nodeExternalUrlParams:
        $ref: '#/definitions/FunnelNodeExternalUrlParams'
      nodeCodeParams:
        $ref: '#/definitions/FunnelNodeCodeSnippetParams'
      nodeConditionParams:
        $ref: '#/definitions/FunnelNodeConditionParams'
      nodeVisitorTagParams:
        $ref: '#/definitions/FunnelNodeVisitorTagParams'
      posX:
        description: Node's X position in the funnel canvas. From 0.0 to 1.0
        type: number
        format: double
        default: 0.0
      posY:
        description: Node's Y position in the funnel canvas. From 0.0 to 1.0
        type: number
        format: double
        default: 0.0
      isArchived:
        type: boolean
        default: false
  FunnelConnectionRotatorParams:
    type: object
    properties:
      weight:
        description: The connection weight from 0.0 to 1.0
        type: number
        format: double
        minimum: 0.0
        maximum: 1.0
        default: 1.0
  FunnelConnectionPageParams:
    type: object
    required: 
      - onActionNumber
    properties:
      onActionNumber:
        description: "'Action' number that will lead the visitor through this connection."
        type: integer
        format: int32
        minimum: 1
        maximum: 64
      isConversion:
        description: Determines if this action leads to a conversion of the source node offer
        type: boolean
        default: false
  FunnelConnectionCodeParams:
    type: object
    required: 
      - onDoneNumber
    properties:
      onDoneNumber:
        description: "'Done' number that will lead the visitor through this connection."
        type: integer
        format: int32
        minimum: 1
        maximum: 64
  FunnelConnectionConditionParams:
    type: object
    required: 
      - condition
    properties:
      condition:
        description: The condition that must be true to follow that connection
        type: string
        enum:
          - ifYes
          - ifNo
  FunnelConnection:
    type: object
    required:
      - idConnection
      - idFunnel
      - idSourceNode
      - idTargetNode
    properties:
      idConnection:
        description: 64 bits integer unique id of the funnel
        type: integer
        format: int64
        minimum: 1
      idFunnel:
        description: 64 bits integer id of the parent funnel
        type: integer
        format: int64
        minimum: 1
      idSourceNode:
        description: 64 bits integer id of the connection's source node. Depending on the type of the source node, different parameters may be required. >
          <ul>
            <li>If source's nodeType is 'root' or 'rotator' then the property 'connectionRotatorParams' is required</li>
            <li>If source's nodeType is 'lander' or 'offer' then the property 'connectionPageParams' is required</li>
            <li>If source's nodeType is 'jsCode' or 'phpCode' then the property 'connectionCodeParams' is required</li>
            <li>If source's nodeType is 'condition' then the property 'connectionConditionParams' is required</li>
          </ul>
        type: integer
        format: int64
        minimum: 1
      idTargetNode:
        description: 64 bits integer id of the connection's target node
        type: integer
        format: int64
        minimum: 1
      connectionRotatorParams:
        $ref: '#/definitions/FunnelConnectionRotatorParams'
      connectionPageParams:
        $ref: '#/definitions/FunnelConnectionPageParams'
      connectionCodeParams:
        $ref: '#/definitions/FunnelConnectionCodeParams'
      connectionConditionParams:
        $ref: '#/definitions/FunnelConnectionConditionParams'
      labelLocation:
        description: Connection's label's canvas location on the link between the source and target nodes. From 0.0 to 1.0. 0.0=positioned on the source node and 1.0=positioned on the target node.
        type: number
        format: double
        default: 0.5
  FunnelConditionTestGenericParams:
    type: object
    required:
      - values
    properties:
      values:
        description: "Values to test against (as 'OR'). '**unknown**' can be used to test for non-available data. If at least one test is true, the condition passes."
        type: array
        items: {
          type: string
        }
  FunnelConditionTestTimeDateParams:
    type: object
    description: The date is tested against the visitor's timezone.
    required:
      - date
    properties:
      date:
        $ref: '#/definitions/Date'
  FunnelConditionTestTimeOfDayParams:
    type: object
    description: The time is tested against the visitor's timezone
    required:
      - time
    properties:
      time:
        $ref: '#/definitions/TimeHHMM'
  FunnelConditionTestTimeDayOfWeekParams:
    type: object
    description: The day is tested against the visitor's timezone
    required:
      - day
    properties:
      day:
        type: string
        enum:
          - sunday
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
  FunnelConditionTestTimeDayOfMonthParams:
    type: object
    description: The day is tested against the visitor's timezone
    required:
      - day
    properties:
      day:
        type: integer
        format: int32
        minimum: 1
        maximum: 31
  FunnelConditionTestTimeMonthOfYearParams:
    type: object
    description: The month is tested against the visitor's timezone
    required:
      - month
    properties:
      month:
        type: string
        enum:
          - january
          - february
          - march
          - april
          - may
          - june
          - july
          - august
          - september
          - october
          - november
          - december
  FunnelConditionTestVisitorConversionParams:
    type: object
    required:
      - idOffer
      - conversionsCount
    properties:
      idOffer:
        type: string
      conversionsCount:
        type: string
  FunnelConditionTestOfferConversionParams:
    type: object
    required:
      - idOffer
      - conversionsCount
      - lastXDays
    properties:
      idOffer:
        type: string
      conversionsCount:
        type: string
      lastXDays:
        description: if 1 then today, if 2 then yesterday + today etc...
        type: integer
        format: int32
        minimum: 1
  FunnelConditionTestTrackingFieldParams:
    type: object
    required:
      - trackingField
      - values
    properties:
      trackingField:
        type: string
      values:
        type: array
        items: {
          type: string
        }
  FunnelConditionTest:
    type: object
    required:
      - test
      - operator
    properties:
      test:
        description: Depending on the selected test, some other properties may become required. >
          <ul>
            <li>For test 'Time Date', testAgainstTimeDateParams is required</li>
            <li>For test 'Time Time of Day', testAgainstTimeOfDayParams is required</li>
            <li>For test 'Time Day of Week', testAgainstTimeDayOfWeekParams is required</li>
            <li>For test 'Time Day of Month', testAgainstTimeDayOfMonthParams is required</li>
            <li>For test 'Time Month of Year', testAgainstTimeMonthOfYearParams is required</li>
            <li>For test 'Conversion Cap Current Visitor', testAgainstVisitorConversionParams is required</li>
            <li>For test 'Conversion Cap Globally on Offer', testAgainstOfferConversionParams is required</li>
            <li>For test 'Tracking Field', testAgainstTrackingFieldParams is required</li>
            <li>For all other tests, testAgainstGenericParams is required</li>
          </ul>
        type: string
        enum:
          - 'Location: Continent'
          - 'Location: Country'
          - 'Location: City'
          - 'Location: Region'
          - 'Location: Timezone'
          - 'Device: Type'
          - 'Device: Brand'
          - 'Device: Model'
          - 'Device: OS'
          - 'Device: OS Version'
          - 'Device: Browser'
          - 'Device: Browser Language'
          - 'Device: Browser Version'
          - 'Connection: IP'
          - 'Connection: ISP'
          - 'Connection: User Agent'
          - 'Connection: Referrer'
          - 'Connection: Current URL'
          - 'Conversion Cap: Current Visitor'
          - 'Conversion Cap: Globally on Offer'
          - 'Time: Date'
          - 'Time: Day of Week'
          - 'Time: Day of Month'
          - 'Time: Month of Year'
          - 'Time: Time of Day'
          - 'Quantity: Number of Visitors'
          - 'Quantity: Number of Visitors Today'
          - 'Traffic Source'
          - 'Tracking Field'
      operator:
        description: Test operator
        type: string
        enum:
          - 'IS'
          - 'IS NOT'
          - '>'
          - '>='
          - '<'
          - '<='
      testAgainstGenericParams:
        $ref: '#/definitions/FunnelConditionTestGenericParams'
      testAgainstTimeDateParams:
        $ref: '#/definitions/FunnelConditionTestTimeDateParams'
      testAgainstTimeOfDayParams:
        $ref: '#/definitions/FunnelConditionTestTimeOfDayParams'
      testAgainstTimeDayOfWeekParams:
        $ref: '#/definitions/FunnelConditionTestTimeDayOfWeekParams'
      testAgainstTimeDayOfMonthParams:
        $ref: '#/definitions/FunnelConditionTestTimeDayOfMonthParams'
      testAgainstTimeMonthOfYearParams:
        $ref: '#/definitions/FunnelConditionTestTimeMonthOfYearParams'
      testAgainstVisitorConversionParams:
        $ref: '#/definitions/FunnelConditionTestVisitorConversionParams'
      testAgainstOfferConversionParams:
        $ref: '#/definitions/FunnelConditionTestOfferConversionParams'
      testAgainstTrackingFieldParams:
        $ref: '#/definitions/FunnelConditionTestTrackingFieldParams'
  FunnelConditionTestsBlock:
    type: object
    required:
      - andTests
    properties:
      andTests:
        description: All tests must be true for the condition to pass
        type: array
        items: {
          $ref: '#/definitions/FunnelConditionTest'
        }
  FunnelCondition:
    type: object
    required:
      - idCondition
      - conditionName
      - orTests
    properties:
      idCondition:
        description: 64 bits integer id of the condition
        type: integer
        format: int64
        minimum: 1
      conditionName:
        type: string
      orTests:
        description: At least one of those test blocks must be true for the condition to pass
        type: array
        items: {
          $ref: '#/definitions/FunnelConditionTestsBlock'
        }
      restrictToFunnelId:
        description: If '', then can be used in all funnels, otherwise, id of the single funnel that can use this condition. 
        type: string
        default: ''
  FunnelCodeSnippetJavascriptParams:
    type: object
    required:
      - delay
    properties:
      delay:
        description: Duration in milliseconds to keep the javascript code snippet running
        type: integer
        format: int32
        minimum: 0
  FunnelCodeSnippet:
    type: object
    required:
      - idCode
      - codeName
      - codeType
      - codeContent
    properties:
      idCode:
        description: 64 bits integer unique id of the funnel
        type: integer
        format: int64
        minimum: 1
      codeName:
        type: string
      codeType:
        description: If codeType = 'javascript' then codeJavascriptParams is required
        type: string
        enum:
          - javascript
          - php
      codeContent:
        type: string
      codeJavascriptParams:
        $ref: '#/definitions/FunnelCodeSnippetJavascriptParams'
  Funnel:
    type: object
    required:
      - idFunnel
      - idCampaign
      - funnelName
      - canvasWidth
      - canvasHeight
    properties:
      idFunnel:
        description: 64 bits integer unique id of the funnel
        type: integer
        format: int64
        minimum: 1
      idCampaign:
        description: 64 bits integer id of the parent campaign
        type: integer
        format: int64
        minimum: 1
      funnelName:
        description: Funnel's name. 255 characters max.
        type: string
      defaultCostPerEntrance:
        description: Default cost to use in tracking urls when the used traffic source doesn't have any default cost. It can be a numeric value or a string (a cost token). 255 chars max.
        type: string
      canvasWidth:
        description: Width in pixels of the funnel canvas. When creating nodes, their positions are given between 0.0 and 1.0. 0 being total left and 1 total right.
        type: integer
        format: int32
      canvasHeight:
        description: Height in pixels of the funnel canvas. When creating nodes, their positions are given between 0.0 and 1.0. 0 being top and 1 for bottom.
        type: integer
        format: int32
      acculumatedUrlParams:
        description: Query parameters to add to the tracking url for this funnel
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      customTokens:
        description: Custom tokens usable in conditions, JS nodes and PHP nodes
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      incomingTrafficCostOverrides:
        description: A list of traffic source cost overrides of incoming traffic for this funnel. The key represents the traffic source id and the value the new cost to apply to new visits from that traffic source.
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      postbackOverrides:
        description: A list of traffic source postback overrides for this funnel.
        type: array
        items: {
          $ref: '#/definitions/Postback'
        }
      nodes: 
        description: A list of nodes used in this funnel. Note this can be an empty array when a funnel is loaded without its dependencies.
        type: array
        items: {
          $ref: '#/definitions/FunnelNode'
        }
        default: []
      connections: 
        description: A list of connections linking this funnel's nodes. Note this can be an empty array when a funnel is loaded without its dependencies.
        type: array
        items: {
          $ref: '#/definitions/FunnelConnection'
        }
        default: []
      isArchived:
        type: boolean
        default: false
  Campaign:
    type: object
    required:
      - idCampaign
      - campaignName
    properties:
      idCampaign:
        description: 64 bits integer id of the campaign
        type: integer
        format: int64
        minimum: 1
      campaignName:
        description: Campaign's name. 255 characters max.
        type: string
      acculumatedUrlParams:
        description: Query parameters to add to the tracking url for all the funnels of this campaign, unless a specific funnel overwrites them
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      customTokens:
        description: Custom tokens usable in conditions, JS nodes and PHP nodes for all the funnels of this campaign
        type: array
        items: {
          $ref: '#/definitions/KeyValuePair'
        }
      isArchived:
        type: boolean
        default: false
  FluxifyLinkRewriterParams:
      type: object
      properties:
        map:
          description: The KeyValuePair object is composed of >
            <ul>
              <li>key - Url to be rewritten. Accepts wildcards *</li>
              <li>value - New rewritten url. Can be [[action:X]] to rewrite to a specific action. X being the action number</li>
            </ul>        
          type: array
          items: {
            $ref: '#/definitions/KeyValuePair'
          }
  FluxifyContentRewriterParams:
      type: object
      properties:
        map:
          description: The KeyValuePair object is composed of >
            <ul>
              <li>key - Content to be rewritten</li>
              <li>value - New rewritten content</li>
            </ul>        
          type: array
          items: {
            $ref: '#/definitions/KeyValuePair'
          }
          default: []
        headerCode:
          description: Code to inject between <head> and </head>
          type: string
          default: ''
        footerCode:
          description: Code to inject just before </body>
          type: string
          default: ''
  FluxifyReferrerAndUASpooferParams:
    type: object
    properties:
      referrers:
        description: List of referrers. One will be picked randomly from this list at each visit
        type: array
        items: {
          type: string
        }
        default: []
      userAgents:
        description: List of user agents. One will be picked randomly from this list at each visit
        type: array
        items: {
          type: string
        }
        default: []
  FluxifyParams:
    type: object
    properties:
      enableCache:
        description: true to enable cache, so the page is saved on the local server
        type: boolean
        default: true
      enableDirectTrafficProtection:
        description: true to enable direct traffic protection, so the page is only visible when coming from a tracking link
        type: boolean
        default: false
      enableLinkRewriter:
        description: true to enable link rewriter. If true, then linkRewriterParams is required
        type: boolean
        default: false
      enableContentRewriter:
        description: true to enable content rewriter. If true, then contentRewriterParams is required
        type: boolean
        default: false
      enableVideoAutoPlayBreaker:
        description: true to prevent videos from auto-playing
        type: boolean
        default: false
      enableExitPopupBreaker:
        description: true to remove exit popups
        type: boolean
        default: false
      enableAnalyticsBreaker:
        description: true to block analytic scripts from recording FunnelFlux views
        type: boolean
        default: false
      enableReferrerAndUASpoofer:
        description: true to send fake referrer and user agents. If true, then referrerAndUASpooferParams is required
        type: boolean
        default: false
      linkRewriterParams:
        $ref: '#/definitions/FluxifyLinkRewriterParams'
      contentRewriterParams:
        $ref: '#/definitions/FluxifyContentRewriterParams'
      referrerAndUASpooferParams:
        $ref: '#/definitions/FluxifyReferrerAndUASpooferParams'
  OfferParams:
    type: object
    required:
      - idOfferSource
    properties:
      idOfferSource:
        description: 64 bits integer id of the offer's source.
        type: integer
        format: int64
        minimum: 1
      payout:
        description: Default payout amount
        type: number
        format: double
        default: 0.0
  CampaignsFunnelsAndNodes:
    type: object
    properties:
      items:
        description: A tree having campaigns at the top level, funnels below campaigns, and nodes as leaves
        type: array
        items: {
          $ref: '#/definitions/KeyValuePairTreeItem'
        }
        default: []
  Page:
    type: object
    required:
      - idPage
      - pageType
      - pageName
      - url
    properties:
      idPage:
        description: 64 bits integer id of the page
        type: integer
        format: int64
        minimum: 1
      pageType:
        description: What kind of page. If 'offer' then 'offerParams' is required
        type: string
        enum:
          - lander
          - offer
      pageName:
        description: Page's name. 255 characters max.
        type: string
      url:
        description: Redirects to this URL when page is displayed
        type: string
      redirectType:
        description: How to redirect to the page's URL. 'umr' means 'Ultimate Meta Refresh'. 'fluxify' for cloaking the page with advanced settings. If 'fluxify' is used, then 'fluxifyParams' is required. By default, it uses the redirect type mentioned in the system settings for landers and offers.
        type: string
        enum:
          - 301
          - 307
          - umr
          - fluxify
      tags:
        description: List of tags assigned to the page. The category name is built from the tags, where each tag is separated by a dash.
        type: array
        items: {
          type: string
        }
        default: []
      notes:
        description: Optional notes for this page
        type: string
        default: ''
      offerParams:
        $ref: '#/definitions/OfferParams'
      fluxifyParams:
        $ref: '#/definitions/FluxifyParams'
      isArchived:
        type: boolean
        default: false
  Date:
    type: object
    required:
      - year
      - month
      - day
    properties:
      year:
        type: integer
        format: int32
        minimum: 1970
      month:
        type: integer
        format: int32
        minimum: 1
        maximum: 12
      day:
        type: integer
        format: int32
        minimum: 1
        maximum: 31
  TimeHHMM:
    type: object
    required:
      - hour
      - minutes
    properties:
      hour:
        type: integer
        format: int32
        minimum: 0
        maximum: 23
      minutes:
        type: integer
        format: int32
        minimum: 0
        maximum: 59
  Error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
