swagger: '2.0'
info:
  title: FunnelFlux Data API
  description: API endpoints to manage an installation's assets
  version: "2.0.0"
schemes:
  - http
  - https
host: ff-domain.com
basePath: /admin/api/v2
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: offersources
    description: API endpoints to manage offer sources
  - name: trafficsources
    description: API endpoints to manage traffic sources
  - name: pages
    description: API endpoints to manage landers and offers
  - name: campaigns
    description: API endpoints to manage campaigns
  - name: funnels
    description: API endpoints to manage funnels
  - name: funnel-nodes
    description: API endpoints to manage funnels' nodes
  - name: funnel-connections
    description: API endpoints to manage funnels' connections
  - name: funnel-conditions
    description: API endpoints to manage funnels' conditions
  - name: funnel-code-snippets
    description: API endpoints to manage funnels' code snippets
  - name: trafficfilters
    description: API endpoints to manage traffic filters
paths:
  /data/offersource/find/byId/index.php:
    get:
      tags: 
        - offersources
      description: Retrieve an offer source by its id
      parameters:
        - name: apiKey
          required: true
          in: query
          type: string
          description: An authorized api key
        - name: idOfferSource
          required: true
          in: query
          type: string
      responses:
        200:
          description: The requested offer source
          schema:
            $ref: '#/definitions/OfferSource'
        403:
          description: Not authorized
        404:
          description: Offer source not found
        default:
          description: Unexpected error
          schema:
            $ref: '#/definitions/Error'
  /data/offersource/find/byName/index.php:
